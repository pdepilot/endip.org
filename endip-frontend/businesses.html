<!DOCTYPE html>
<html lang="en-NG" data-base="." data-layout="public" data-page="businesses">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENDIP Business Network</title>
  <meta name="description" content="ENDIP Business Network directory of published enterprises.">
  <link rel="icon" href="assets/images/end-logo.png">
  <link rel="stylesheet" href="assets/css/endip.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <div class="page-hero"><div class="container">
      <h1>Business Network</h1>
      <p class="lede">Search published businesses in the ENDIP network.</p>
    </div></div>
    <section class="section-tight"><div class="container">
      <div class="filter-bar">
        <div class="field"><label for="bq">Search</label><input id="bq" type="search" placeholder="Search businesses..."></div>
        <div class="field"><label for="sector">Sector</label>
          <select id="sector"><option value="">All</option><option>Waste and recycling</option><option>Fashion and making</option><option>ICT services</option><option>Agribusiness</option></select>
        </div>
        <div class="field"><label for="bloc">Location</label><input id="bloc" placeholder="City or state"></div>
        <label class="checkbox" style="align-self:end"><input type="checkbox" id="verified"> Verified only</label>
        <label class="checkbox" style="align-self:end"><input type="checkbox" id="featured"> Featured</label>
        <div class="field"><label for="bsort">Sort</label><select id="bsort"><option value="name">Name</option><option value="sector">Sector</option></select></div>
      </div>
      <div id="business-results"></div>
    </div></section>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
