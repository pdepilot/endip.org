<!DOCTYPE html>
<html lang="en-NG" data-base=".." data-layout="auth" data-page="reset">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | ENDIP</title>
  <meta name="description" content="Set a new ENDIP password.">
  <link rel="icon" href="../assets/images/end-logo.png">
  <link rel="stylesheet" href="../assets/css/endip.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="section"><div class="container" style="max-width:480px">
      <h1>Reset password</h1>
      <form class="card" data-auth-form>
        <div class="card-body">
          <p id="auth-error" class="field-error"></p>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
          <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" required minlength="8"></div>
          <button class="btn btn-primary btn-block" type="submit">Update password</button>
        </div>
      </form>
      <div class="form-success alert alert-success" id="auth-ok">Password updated. You can now <a href="login.html">sign in</a>.</div>
    </div></section>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
