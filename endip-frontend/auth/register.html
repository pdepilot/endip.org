<!DOCTYPE html>
<html lang="en-NG" data-base=".." data-layout="auth" data-page="register">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an ENDIP account</title>
  <meta name="description" content="Register for an ENDIP account.">
  <link rel="icon" href="../assets/images/end-logo.png">
  <link rel="stylesheet" href="../assets/css/endip.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="section"><div class="container" style="max-width:480px">
      <h1>Create account</h1>
      <form class="card" data-auth-form>
        <div class="card-body">
          <p id="auth-error" class="field-error"></p>
          <div class="field"><label for="name">Full name</label><input id="name" name="name" required></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
          <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8"></div>
          <div class="field"><label for="role">I am registering as</label>
            <select id="role" name="role">
              <option value="Participant">Participant</option>
              <option value="Entrepreneur">Entrepreneur</option>
            </select>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Register</button>
          <p><a href="login.html">Already have an account?</a></p>
        </div>
      </form>
    </div></section>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
