<!DOCTYPE html>
<html lang="en-NG" data-base=".." data-layout="auth" data-page="forgot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | ENDIP</title>
  <meta name="description" content="Request an ENDIP password reset.">
  <link rel="icon" href="../assets/images/end-logo.png">
  <link rel="stylesheet" href="../assets/css/endip.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="section"><div class="container" style="max-width:480px">
      <h1>Forgot password</h1>
      <form class="card" data-auth-form>
        <div class="card-body">
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
          <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
        </div>
      </form>
      <div class="form-success alert alert-success" id="auth-ok">If an account exists for that email, you can continue to reset your password.</div>
      <p><a href="reset-password.html">Reset password</a></p>
    </div></section>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
